<!doctype html>
<html lang="en" class="k-intro-active">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KICCLE — FOOTWEAR ARCHIVE</title>
    <meta
      name="description"
      content="KICCLE — FOOTWEAR ARCHIVE. An independent digital sneaker exhibition: ten pairs on lit acrylic plinths, presented as collectible design objects."
    />
    <meta name="theme-color" content="#090a0c" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="KICCLE — FOOTWEAR ARCHIVE" />
    <meta property="og:description" content="An independent digital sneaker exhibition." />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />

    <!-- Fonts: self-hosted, OFL-1.1 (see assets/fonts/*-OFL.txt) -->
    <link rel="preload" href="assets/fonts/Tektur-Medium.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/fonts/InstrumentSans-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Package A: foundation -->
    <link rel="stylesheet" href="src/styles/fonts.css" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/shell.css" />
    <link rel="stylesheet" href="src/styles/intro.css" />
    <!-- Package B: showroom -->
    <link rel="stylesheet" href="src/views/showroom/showroom.css" />
    <!-- Package C: detail + cart -->
    <link rel="stylesheet" href="src/views/detail/detail.css" />
    <link rel="stylesheet" href="src/cart/cart.css" />
    <!-- Package D: editorial pages -->
    <link rel="stylesheet" href="src/views/about/about.css" />
    <link rel="stylesheet" href="src/views/faq/faq.css" />
    <link rel="stylesheet" href="src/views/collections/collections.css" />

    <link rel="modulepreload" href="dist/main.js" />
    <script type="module" src="dist/main.js"></script>
  </head>
  <body data-surface="stage">
    <a class="k-skip" href="#k-main" data-skip-link>Skip to content</a>

    <!-- Intro: static so it paints on the first frame. Controlled by src/components/intro.ts -->
    <div id="k-intro" class="k-intro" aria-hidden="true">
      <div class="k-intro__pool"></div>
      <div class="k-intro__vignette"></div>
      <div class="k-intro__inner">
        <span class="k-wordmark k-intro__wordmark" role="img" aria-label="KICCLE"
          ><span class="k-intro__ch" style="--k-ch: 0" aria-hidden="true">K</span
          ><span class="k-intro__ch k-wordmark__i" style="--k-ch: 1" aria-hidden="true">I</span
          ><span class="k-intro__ch" style="--k-ch: 2" aria-hidden="true">C</span
          ><span class="k-intro__ch" style="--k-ch: 3" aria-hidden="true">C</span
          ><span class="k-intro__ch" style="--k-ch: 4" aria-hidden="true">L</span
          ><span class="k-intro__ch" style="--k-ch: 5" aria-hidden="true">E</span
        ></span>
        <svg class="k-intro__stitch" viewBox="0 0 600 8" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <mask id="k-intro-stitch-mask" class="k-intro__stitch-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="8">
              <rect x="0" y="0" width="600" height="8" fill="#fff" />
            </mask>
          </defs>
          <line x1="2" y1="4" x2="598" y2="4" mask="url(#k-intro-stitch-mask)" />
        </svg>
        <span class="k-signature k-intro__signature">FOOTWEAR ARCHIVE</span>
        <div class="k-intro__led">
          <span class="k-intro__led-track"></span>
          <span class="k-intro__led-fill"></span>
          <span class="k-intro__led-flare"></span>
        </div>
        <svg class="k-intro__tread" viewBox="0 0 360 10" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <pattern id="k-intro-lugs" width="18" height="10" patternUnits="userSpaceOnUse">
              <path d="M1 1h7l2 4-2 4H1z" fill="currentColor" />
              <path d="M10 1h7v8h-7l2-4z" fill="currentColor" opacity="0.55" />
            </pattern>
          </defs>
          <rect width="360" height="10" fill="url(#k-intro-lugs)" />
        </svg>
        <p class="k-intro__status">
          <span>Lighting the archive</span>
          <span class="k-intro__count"><span data-intro-count>00</span>/<span data-intro-total>10</span></span>
        </p>
      </div>
    </div>

    <div id="k-app" aria-busy="true">
      <header id="k-nav"></header>
      <main id="k-main">
        <!-- [B] showroom stage: fixed, full viewport, persistent -->
        <section id="k-stage" class="k-surface" aria-label="Showroom"></section>
        <!-- [A/D] editorial pages + footer -->
        <div id="k-pages" class="k-surface" data-surface-state="hidden">
          <div id="k-page-about" class="k-page" data-page="about" tabindex="-1" hidden></div>
          <div id="k-page-faq" class="k-page" data-page="faq" tabindex="-1" hidden></div>
          <div id="k-page-collections" class="k-page" data-page="collections" tabindex="-1" hidden></div>
          <footer id="k-footer"></footer>
        </div>
      </main>
      <!-- [C] detail panel layer and cart drawer layer -->
      <div id="k-detail"></div>
      <div id="k-cart"></div>
      <div id="k-live" class="k-live" aria-live="polite" aria-atomic="true"></div>
    </div>

    <noscript>
      <style>
        .k-intro { display: none !important; }
      </style>
      <p class="k-noscript">KICCLE — FOOTWEAR ARCHIVE needs JavaScript to light the showroom.</p>
    </noscript>
  </body>
</html>
